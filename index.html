<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Blocking, synchronous theme bootstrap. MUST stay first in <head>, before any
      stylesheet or app script, so it runs before first paint.

      Prerendered HTML (scripts/prerender.mjs) ships with a fixed default theme baked in
      at build time, and ThemeContext only corrects it in a useEffect — i.e. after first
      paint — so without this a dark-preferring visitor sees a full light-theme render
      snap to dark on every cold load.

      This mirrors getInitialTheme() in src/theme/ThemeContext.tsx. Keep the two in sync.
    -->
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
